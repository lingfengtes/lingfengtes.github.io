short_bio: >-
  <p>
    I am a graduate student in Computer Technology at the School of Computer Science, <strong>Shaanxi Normal University</strong> (ranked Top 10%, First-Class Academic Scholarship), and a former Computer Vision Algorithm Engineer at <strong>Samsung Electronics (China) R&amp;D Center</strong> (Best Newcomer Award).
  </p>
  <p>
    My research centers on <strong>geometry- and mechanism-guided generalizable multimodal representation learning</strong>—bridging spatial topology distillation (<em>zero-map cross-view geo-localization</em>), intervention-aware causal disentanglement, and <strong>sub-second on-device multimodal agents</strong> deployed on <strong>NVIDIA Jetson AGX Thor</strong>.
  </p>
  <p>
    I am actively seeking 2027/2028 research &amp; core algorithm internship opportunities in <strong>Shenzhen</strong> and <strong>Hangzhou</strong> (spatial intelligence, multimodal perception, and edge agentic AI). Feel free to reach out via email!
  </p>

